[project]
name = "locateanything-batch"
version = "0.1.0"
description = "Batched + KV-cached fast-MTP inference for NVIDIA LocateAnything-3B (stock generate is batch=1 only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["locateanything", "object-detection", "grounding", "vlm", "transformers", "batched-inference", "kv-cache"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=2.4",            # install the build matching your CUDA (see README); the model needs a GPU
    "transformers>=4.57,<5", # LocateAnything-3B ships remote code bound to transformers 4.x
    "accelerate>=1.0",
    "einops>=0.8",           # MoonViT remote code dependency
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
example = ["opencv-python>=4.11"]   # only examples/locate_objects.py needs cv2 for drawing boxes
# OPTIONAL but STRONGLY recommended on a supported GPU: enables MoonViT's varlen flash path for the
# batched vision encode. Without it the engine auto-falls-back to a per-image encode and runs
# ~30% slower end-to-end (see README "Hardware notes"). NOTE: PyPI has no prebuilt wheel for newer
# stacks (e.g. sm_120 / cu128 / torch 2.11) -- `pip install .[flash]` would build from source there;
# install a matching prebuilt wheel instead, e.g. flash-attn==2.8.3+cu128torch2.11 --no-build-isolation.
flash = ["flash-attn>=2.0"]

[project.urls]
Homepage = "https://github.com/liuwang97/LocateAnything-3B-batch"
Issues = "https://github.com/liuwang97/LocateAnything-3B-batch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locateanything_batch"]
